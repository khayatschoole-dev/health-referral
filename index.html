<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="التوجيه الصحي">
<meta name="theme-color" content="#0E5F5E">
<title>التوجيه الصحي</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230E5F5E'/%3E%3Cpath d='M26 14h12v12h12v12H38v12H26V38H14V26h12z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF4F3;--card:#FFFFFF;--ink:#12302F;--mute:#5C7372;--line:#D5E2E0;
  --teal:#0E5F5E;--teal2:#E0F0EE;--pur:#4B3592;
  --red:#B42318;--redbg:#FDECEA;--amb:#8A5300;--ambbg:#FFF1D6;--grn:#26734A;--grnbg:#E4F3E9;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pur);outline-offset:2px}
.hide{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 140px}

/* gate */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate form{width:100%;max-width:360px;background:var(--card);border-radius:20px;padding:28px 22px;border:1px solid var(--line)}
.gate .mark{width:56px;height:56px;border-radius:16px;background:var(--teal);display:grid;place-items:center;margin-bottom:14px}
.gate h1{margin:0 0 4px;font-size:24px}
.gate p{margin:0 0 20px;color:var(--mute);font-size:14px}
label.f{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
.in{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
.in:focus{border-color:var(--teal);outline:none}
.err{color:var(--red);font-size:14px;min-height:22px;margin-top:8px}
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:700;font-size:17px;background:var(--teal);color:#fff}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--teal);color:#fff;padding:14px 16px 0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--teal)}
.top .row{max-width:528px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.top h1{margin:0;font-size:20px}
.top .who{font-size:13px;opacity:.85;background:none;border:0;color:#fff;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.tabs{max-width:528px;margin:12px auto 0;display:flex;gap:4px}
.tabs button{flex:1;border:0;background:transparent;color:#CFE7E4;padding:10px 0 12px;font-weight:600;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{color:#fff;border-bottom-color:#fff}

/* picker */
h2.s{font-size:15px;margin:22px 0 10px;color:var(--mute);font-weight:600}
.search{position:relative;margin-top:18px}
.search .in{padding-inline-start:40px}
.search svg{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);opacity:.5}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 4px;font-weight:600;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--teal);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips button{min-width:46px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 0;font-weight:700}
.chips button[aria-pressed="true"]{border-color:var(--teal);background:var(--teal2);color:var(--teal)}
.list{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:start;border:0;border-top:1px solid var(--line);background:none;padding:12px 14px}
.list button:first-child{border-top:0}
.list button .c{font-size:13px;color:var(--mute);white-space:nowrap}
.list button[aria-pressed="true"]{background:var(--teal2)}
.list button[aria-pressed="true"] .n{font-weight:700;color:var(--teal)}
.empty{padding:22px 14px;color:var(--mute);text-align:center;font-size:15px}

/* chosen student + status */
.chosen{margin-top:22px;background:var(--card);border:1.5px solid var(--teal);border-radius:16px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.chosen b{display:block;font-size:18px}
.chosen span{color:var(--mute);font-size:14px}
.chosen button{border:0;background:var(--teal2);color:var(--teal);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px}
.status{display:grid;gap:10px}
.status button{display:flex;align-items:center;gap:14px;border:2px solid var(--line);background:var(--card);border-radius:16px;padding:16px;text-align:start;font-weight:700;font-size:17px}
.status .dot{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;flex:none;display:grid;place-items:center}
.status button[aria-pressed="true"] .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
.status .emergency{color:var(--red)}
.status .call{color:var(--amb)}
.status .no_call{color:var(--grn)}
.status .emergency[aria-pressed="true"]{background:var(--redbg);border-color:var(--red)}
.status .call[aria-pressed="true"]{background:var(--ambbg);border-color:var(--amb)}
.status .no_call[aria-pressed="true"]{background:var(--grnbg);border-color:var(--grn)}
.status small{display:block;font-weight:500;font-size:13px;color:var(--mute)}
textarea.in{min-height:76px;resize:vertical}

/* send bar */
.bar{position:fixed;inset:auto 0 0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:18px 16px calc(14px + env(safe-area-inset-bottom,0px));z-index:6}
.bar .btn{max-width:528px;margin:0 auto;display:block;padding:16px;font-size:18px}
.bar .btn:disabled{background:#A9C3C1}
.bar .btn.emergency{background:var(--red)}

/* log */
.log{display:grid;gap:10px;margin-top:18px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;border-inline-start:5px solid var(--line)}
.item.emergency{border-inline-start-color:var(--red)}
.item.call{border-inline-start-color:var(--amb)}
.item.no_call{border-inline-start-color:var(--grn)}
.item .t{display:flex;justify-content:space-between;gap:8px}
.item .t b{font-size:16px}
.item .t time{font-size:13px;color:var(--mute);white-space:nowrap}
.item .m{font-size:14px;color:var(--mute)}
.pill{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;margin-top:6px}
.pill.emergency{background:var(--redbg);color:var(--red)}
.pill.call{background:var(--ambbg);color:var(--amb)}
.pill.no_call{background:var(--grnbg);color:var(--grn)}
.pill.wait{background:#EEF0F2;color:#4A5560}
.pill.done{background:#E9E4F7;color:var(--pur)}
.refresh{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;margin-top:16px}

.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:20;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:no-preference){.toast{animation:pop .25s ease-out}@keyframes pop{from{opacity:0;transform:translate(-50%,-8px)}}}
</style>
</head>
<body>

<!-- ===== Gate ===== -->
<div class="gate" id="gate">
  <form id="gateForm" autocomplete="off">
    <div class="mark"><svg width="30" height="30" viewBox="0 0 64 64"><path d="M26 10h12v16h16v12H38v16H26V38H10V26h16z" fill="#fff"/></svg></div>
    <h1>التوجيه الصحي</h1>
    <p>تحويل الحالات الصحية إلى وكيل شؤون الطلاب</p>
    <label class="f" for="gName">اسم الموجه الصحي</label>
    <input class="in" id="gName" required>
    <label class="f" for="gPass">كلمة المرور</label>
    <input class="in" id="gPass" type="password" inputmode="numeric" required>
    <div class="err" id="gErr" role="alert"></div>
    <button class="btn" type="submit">دخول</button>
  </form>
</div>

<!-- ===== App ===== -->
<div id="app" class="hide">
  <header class="top">
    <div class="row">
      <h1>التوجيه الصحي</h1>
      <button class="who" id="who" title="تغيير الاسم"></button>
    </div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabNew" aria-selected="true">تحويل حالة</button>
      <button role="tab" id="tabLog" aria-selected="false">تحويلات اليوم</button>
    </div>
  </header>

  <main class="wrap" id="pNew">
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input class="in" id="q" type="search" placeholder="ابحث باسم الطالب" aria-label="ابحث باسم الطالب">
    </div>

    <h2 class="s">أو اختر الصف والفصل</h2>
    <div class="seg" id="grades"></div>
    <div class="chips" id="sections"></div>

    <div class="list" id="list"><div class="empty">جاري تحميل الطلاب…</div></div>

    <section id="step2" class="hide">
      <div class="chosen">
        <div><b id="cName"></b><span id="cClass"></span></div>
        <button id="cClear">تغيير</button>
      </div>

      <h2 class="s">تقييم الحالة</h2>
      <div class="status" id="status">
        <button class="emergency" data-v="emergency" aria-pressed="false"><span class="dot"></span><span>حالة طارئة<small>تحتاج تدخلاً فورياً</small></span></button>
        <button class="call" data-v="call" aria-pressed="false"><span class="dot"></span><span>حالته تستدعي الاتصال<small>يُتصل بولي الأمر</small></span></button>
        <button class="no_call" data-v="no_call" aria-pressed="false"><span class="dot"></span><span>حالته لا تستدعي الاتصال<small>للعلم فقط</small></span></button>
      </div>

      <h2 class="s"><label for="note">ملاحظة للوكيل (اختياري)</label></h2>
      <textarea class="in" id="note" placeholder="مثال: ارتفاع حرارة، صداع شديد"></textarea>
    </section>
  </main>

  <main class="wrap hide" id="pLog">
    <button class="refresh" id="refresh">تحديث</button>
    <div class="log" id="log"></div>
  </main>

  <div class="bar" id="bar">
    <button class="btn" id="send" disabled>اختر الطالب</button>
  </div>
</div>

<div class="toast hide" id="toast" role="status"></div>

<script>
/* ===== الإعدادات ===== */
const SB_URL = 'https://hqppacntsggeyxfkobjn.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhxcHBhY250c2dnZXl4ZmtvYmpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5Mjg1NjYsImV4cCI6MjA5MDUwNDU2Nn0.i2kNNTgI7JgJ7bN1Sudie543s_84YYDuPc9rqbSoXJY';
const PASSWORD = '2030';          // غيّرها هنا
const DUP_MINUTES = 15;           // تنبيه إذا حُوِّل نفس الطالب خلال هذه المدة

const H = {apikey:SB_KEY, Authorization:'Bearer '+SB_KEY, 'Content-Type':'application/json'};
const ST = {
  emergency:{t:'حالة طارئة'},
  call:{t:'حالته تستدعي الاتصال'},
  no_call:{t:'حالته لا تستدعي الاتصال'}
};
const GRADES = ['الأول متوسط','الثاني متوسط','الثالث متوسط'];
const GSHORT = {'الأول متوسط':'الأول','الثاني متوسط':'الثاني','الثالث متوسط':'الثالث'};

const $ = id => document.getElementById(id);
const esc = v => String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s||'').replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').trim();
const store = {
  get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},
  set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}
};

let students=[], grade=null, section=null, sel=null, status=null, nurse=store.get('hn_name')||'', busy=false;

function toast(msg,ms){const t=$('toast');t.textContent=msg;t.classList.remove('hide');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.add('hide'),ms||2800)}

async function api(path, opt={}){
  const r = await fetch(SB_URL+'/rest/v1/'+path, {...opt, headers:{...H, ...(opt.headers||{})}});
  if(!r.ok) throw new Error((await r.text()) || r.status);
  return r.status===201||r.status===204 ? null : r.json();
}

/* ===== Gate ===== */
$('gName').value = nurse;
$('gateForm').addEventListener('submit', e=>{
  e.preventDefault();
  const n = $('gName').value.trim();
  if($('gPass').value !== PASSWORD){ $('gErr').textContent='كلمة المرور غير صحيحة'; return; }
  if(n.length < 3){ $('gErr').textContent='اكتب الاسم كاملاً'; return; }
  nurse = n; store.set('hn_name', n);
  $('gate').classList.add('hide'); $('app').classList.remove('hide');
  $('who').textContent = nurse;
  loadStudents();
});
$('who').onclick = ()=>{
  const n = prompt('اسم الموجه الصحي', nurse);
  if(n && n.trim().length>=3){ nurse=n.trim(); store.set('hn_name',nurse); $('who').textContent=nurse; }
};

/* ===== Students ===== */
async function loadStudents(){
  try{
    students = await api('khyat_students?select=student_id,student_name,class_grade,class_section,class_label&order=student_name&limit=2000');
    students.forEach(s=>s._n = norm(s.student_name));
    renderGrades(); renderList();
  }catch(e){
    $('list').innerHTML = '<div class="empty">تعذّر تحميل الطلاب. تحقق من الاتصال ثم أعد فتح الصفحة.</div>';
  }
}
function renderGrades(){
  $('grades').innerHTML = GRADES.map(g=>`<button aria-pressed="${g===grade}" data-g="${esc(g)}">${GSHORT[g]}</button>`).join('');
  const secs = grade ? [...new Set(students.filter(s=>s.class_grade===grade).map(s=>s.class_section))].sort((a,b)=>a-b) : [];
  $('sections').innerHTML = secs.map(n=>`<button aria-pressed="${n===section}" data-s="${esc(n)}">${esc(n)}</button>`).join('');
}
$('grades').onclick = e=>{const b=e.target.closest('button'); if(!b) return; grade=b.dataset.g; section=null; $('q').value=''; renderGrades(); renderList();};
$('sections').onclick = e=>{const b=e.target.closest('button'); if(!b) return; section=b.dataset.s; $('q').value=''; renderGrades(); renderList();};
$('q').addEventListener('input', renderList);

function renderList(){
  const q = norm($('q').value);
  let rows = [];
  if(q.length >= 2) rows = students.filter(s=>s._n.includes(q)).slice(0,60);
  else if(grade && section) rows = students.filter(s=>s.class_grade===grade && s.class_section===section);
  if(!rows.length){
    $('list').innerHTML = `<div class="empty">${q.length>=2 ? 'لا يوجد طالب بهذا الاسم' : (grade ? 'اختر الفصل' : 'ابحث بالاسم أو اختر الصف ثم الفصل')}</div>`;
    return;
  }
  $('list').innerHTML = rows.map(s=>`<button data-id="${esc(s.student_id)}" aria-pressed="${!!sel && sel.student_id===s.student_id}"><span class="n">${esc(s.student_name)}</span><span class="c">${esc(s.class_label)}</span></button>`).join('');
}
$('list').onclick = e=>{
  const b = e.target.closest('button[data-id]'); if(!b) return;
  sel = students.find(s=>s.student_id===b.dataset.id);
  $('cName').textContent = sel.student_name;
  $('cClass').textContent = sel.class_label;
  $('step2').classList.remove('hide');
  renderList(); updateBar();
  $('step2').scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth', block:'start'});
};
$('cClear').onclick = ()=>{ reset(false); window.scrollTo({top:0}); };

/* ===== Status ===== */
$('status').onclick = e=>{
  const b = e.target.closest('button[data-v]'); if(!b) return;
  status = b.dataset.v;
  [...$('status').children].forEach(x=>x.setAttribute('aria-pressed', x===b));
  updateBar();
};
function updateBar(){
  const s=$('send');
  s.classList.toggle('emergency', status==='emergency');
  if(!sel){ s.disabled=true; s.textContent='اختر الطالب'; }
  else if(!status){ s.disabled=true; s.textContent='اختر تقييم الحالة'; }
  else { s.disabled=busy; s.textContent = busy ? 'جاري التحويل…' : 'تحويل إلى الوكيل'; }
}
function reset(keepClass=true){
  sel=null; status=null; $('note').value='';
  $('step2').classList.add('hide');
  [...$('status').children].forEach(x=>x.setAttribute('aria-pressed','false'));
  if(!keepClass){ $('q').value=''; }
  renderList(); updateBar();
}

/* ===== Send ===== */
$('send').onclick = async ()=>{
  if(!sel || !status || busy) return;
  busy=true; updateBar();
  try{
    const since = new Date(Date.now()-DUP_MINUTES*60000).toISOString();
    const dup = await api(`health_alerts?select=id&student_id=eq.${encodeURIComponent(sel.student_id)}&created_at=gte.${encodeURIComponent(since)}`);
    if(dup.length && !confirm(`حُوِّل هذا الطالب خلال آخر ${DUP_MINUTES} دقيقة. تحويله مرة أخرى؟`)){ busy=false; updateBar(); return; }
    await api('health_alerts', {method:'POST', headers:{Prefer:'return=minimal'}, body:JSON.stringify({
      student_id: sel.student_id, student_name: sel.student_name, class: sel.class_label,
      status, note: $('note').value.trim() || null, nurse_name: nurse
    })});
    toast('تم التحويل إلى الوكيل: '+sel.student_name);
    reset(true); window.scrollTo({top:0});
  }catch(e){
    toast('لم يتم التحويل. تحقق من الاتصال وحاول مرة أخرى', 4000);
  }
  busy=false; updateBar();
};

/* ===== Tabs + log ===== */
function tab(which){
  const isNew = which==='new';
  $('tabNew').setAttribute('aria-selected', isNew); $('tabLog').setAttribute('aria-selected', !isNew);
  $('pNew').classList.toggle('hide', !isNew); $('pLog').classList.toggle('hide', isNew);
  $('bar').classList.toggle('hide', !isNew);
  if(!isNew) loadLog();
}
$('tabNew').onclick = ()=>tab('new');
$('tabLog').onclick = ()=>tab('log');
$('refresh').onclick = loadLog;

async function loadLog(){
  const d = new Date(); d.setHours(0,0,0,0);
  $('log').innerHTML = '<div class="empty">جاري التحميل…</div>';
  try{
    const rows = await api(`health_alerts?select=id,student_name,class,status,note,created_at,handled,handled_by&created_at=gte.${encodeURIComponent(d.toISOString())}&nurse_name=eq.${encodeURIComponent(nurse)}&order=created_at.desc`);
    if(!rows.length){ $('log').innerHTML='<div class="empty">لم تحوّل أي حالة اليوم</div>'; return; }
    $('log').innerHTML = rows.map(r=>`
      <div class="item ${esc(r.status)}">
        <div class="t"><b>${esc(r.student_name)}</b><time>${new Date(r.created_at).toLocaleTimeString('ar-SA-u-nu-arab',{hour:'numeric',minute:'2-digit'})}</time></div>
        <div class="m">${esc(r.class)}${r.note?' — '+esc(r.note):''}</div>
        <span class="pill ${esc(r.status)}">${ST[r.status]?.t||''}</span>
        <span class="pill ${r.handled?'done':'wait'}">${r.handled ? 'تمت المتابعة'+(r.handled_by?' — '+esc(r.handled_by):'') : 'بانتظار الوكيل'}</span>
      </div>`).join('');
  }catch(e){
    $('log').innerHTML = '<div class="empty">تعذّر تحميل السجل. اضغط «تحديث».</div>';
  }
}
</script>
</body>
</html>
